
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#0b57d0"/>
  <title>Mitigation Tech (PWA)</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;color:#0f172a}
    header{padding:10px;background:#0b57d0;color:#fff;display:flex;align-items:center;gap:8px}
    .badge{background:#1f2937;color:#fff;padding:4px 8px;border-radius:6px;font-size:.85rem}
    .right{margin-left:auto}
    main{padding:16px}
    dialog{border:none;border-radius:10px;max-width:420px}
    label{display:block;margin:8px 0}
    input,select{padding:8px;border:1px solid #cbd5e1;border-radius:6px;width:100%}
    button{background:#0b57d0;color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer}
    button.secondary{background:#334155}
  </style>
</head>
<body>
  <header>
    <strong>Mitigation Tech</strong>
    <span id="aiPathBadge" class="badge" title="Current AI provider">AI: Gemini (API key)</span>
    <button id="btnSettings" class="right secondary">Settings</button>
  </header>

  <main>
    <section>
      <h3>Room Scan (WebXR)</h3>
      <button id="btnStartXR">Start AR scan</button>
      <div id="xrStatus" class="muted"></div>
    </section>

    <section>
      <h3>Scan Inbox</h3>
      <ul id="inbox"></ul>
    </section>

    <section>
      <h3>QR Tools</h3>
      <button id="btnOpenQr">Open QR Scanner</button>
      <div id="qrArea" style="margin:8px 0"></div>
      <div>
        <input id="qrLink" placeholder="https://demo.yourdomain.com/#/import-scan?job=123&scanId=abc"/>
        <button id="btnMakeQr" class="secondary">Make QR</button>
        <div id="qrOut" style="margin-top:8px"></div>
      </div>
    </section>
  </main>

  <dialog id="dlgSettings">
    <form method="dialog">
      <h3>Settings</h3>
      <label>Job ID
        <input id="inpJob" type="number" min="1" value="123"/>
      </label>
      <label>AI Mode
        <select id="selMode">
          <option value="simple">Simple (Gemini API key)</option>
          <option value="advanced">Advanced (Backend provider)</option>
        </select>
      </label>
      <label>Provider <input id="inpProvider" placeholder="Azure / OpenAI / Vertex"/></label>
      <label>Model <input id="inpModel" placeholder="gpt-4o-mini / gemini-1.5"/></label>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px">
        <button value="cancel" class="secondary">Cancel</button>
        <button id="btnSave">Save</button>
      </div>
    </form>
  </dialog>

  <script> if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js'); </script>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
